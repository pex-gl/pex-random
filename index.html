<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>pex-random by pex-gl (https://github.com/pex-gl)</title>
    <style>
      :root {
        --color-dark: #222222;
        --color-light: #f2f2f2;
        --color-accent: #95171d;
      }

      body {
        margin: 0;
        overscroll-behavior: none;
        font-family: sans-serif;
        color: var(--color-dark);
        background-color: var(--color-light);
      }

      main {
        padding: 0 20px;
      }

      canvas {
        background-color: #fff;
      }

      .Noise {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .Curl-controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 20px;
        margin-bottom: 10px;
      }
      .Curl {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .Curl figure {
        margin: 0;
        width: 256px;
      }
      .Curl figcaption {
        font-size: 0.8em;
      }
      .Curl-rgb {
        width: 256px;
        height: 256px;
      }
      .Chance {
        display: flex;
        flex-direction: column;
        flex-wrap: wrap;
        gap: 10px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>pex-random</h1>
      <h2>noise</h2>
      <div class="Noise">
        <div>
          <h3>2D</h3>
          <canvas class="Noise-2d-64"></canvas>
          <canvas class="Noise-2d-128"></canvas>
          <canvas class="Noise-2d-256"></canvas>
        </div>
        <div>
          <h3>3D</h3>
          <canvas class="Noise-3d"></canvas>
        </div>
        <div>
          <h3>FBM</h3>
          <canvas class="Noise-octave"></canvas>
        </div>
      </div>
      <h2>vec2Noise/vec3Noise/curl2/curl3</h2>
      <div class="Curl-controls">
        <label>
          frequency
          <input
            class="Curl-frequency"
            type="range"
            min="0.002"
            max="0.03"
            step="0.001"
            value="0.008"
          />
        </label>
        <label>
          speed
          <input
            class="Curl-speed"
            type="range"
            min="0.1"
            max="3"
            step="0.1"
            value="1"
          />
        </label>
        <label>
          time scale (0 = frozen)
          <input
            class="Curl-time-scale"
            type="range"
            min="0"
            max="1"
            step="0.05"
            value="0.2"
          />
        </label>
        <button class="Curl-replay">Replay</button>
        <button class="Curl-reseed">Reseed</button>
        <span class="Curl-seed"></span>
      </div>
      <div class="Curl">
        <figure>
          <h3>curl2 particles</h3>
          <canvas class="Curl-particles" width="256" height="256"></canvas>
          <figcaption>
            Particles with a lifetime. They swirl without piling up or leaving
            holes. Replay: same seed, same motion.
          </figcaption>
        </figure>
        <figure>
          <h3>vec2Noise</h3>
          <canvas class="Curl-gutters" width="256" height="256"></canvas>
          <figcaption>
            Plain noise as velocity: particles drain into lines, then points
            (sinks or "gutters").
            <br />Coverage: <span class="Curl-gutters-coverage"></span>
          </figcaption>
        </figure>
        <figure>
          <h3>curl2</h3>
          <canvas
            class="Curl-divergence-free"
            width="256"
            height="256"
          ></canvas>
          <figcaption>
            Same particles, curl2 velocity: they stay evenly spread.
            <br />Coverage: <span class="Curl-divergence-free-coverage"></span>
          </figcaption>
        </figure>
        <figure>
          <h3>curl2 over its potential</h3>
          <canvas class="Curl-potential" width="256" height="256"></canvas>
          <figcaption>
            Arrows follow the contour lines of noise3: curl is the gradient
            turned 90°.
            <select class="Curl-potential-mode">
              <option value="morph">morph: curl2(x, y, t)</option>
              <option value="scroll">scroll: curl2(x + t, y)</option>
            </select>
          </figcaption>
        </figure>
        <figure>
          <h3>vec3Noise as RGB</h3>
          <canvas class="Curl-rgb" width="128" height="128"></canvas>
          <figcaption>Three independent channels, animated with w.</figcaption>
        </figure>
        <figure>
          <h3>curl3 particles</h3>
          <canvas class="Curl-particles-3d" width="256" height="256"></canvas>
          <figcaption>
            3D particles in a rotating cube. Darker: denser or closer.
          </figcaption>
        </figure>
      </div>
      <h2>chance</h2>
      <div class="Chance">
        <div>
          <input
            class="Chance-input"
            type="number"
            value="0.5"
            step="0.1"
            min="0"
            max="1"
          />
          <button class="Chance-generate">Generate</button>
        </div>
        <div>
          <canvas class="Chance-canvas" width="128" height="128"></canvas>
        </div>
      </div>
      <h2>vec2/vec3</h2>
      <div>
        <canvas class="Vec2" width="128" height="128"></canvas>
        <canvas class="Vec3" width="128" height="128"></canvas>
      </div>
      <h2>vec2InRect/vec3InAABB</h2>
      <div>
        <canvas class="Vec2InRect" width="128" height="128"></canvas>
        <canvas class="Vec3InAABB" width="128" height="128"></canvas>
      </div>
    </main>
    <script async src="web_modules/es-module-shims.js" type="module"></script>
    <script src="web_modules/import-map.json" type="importmap-shim"></script>
    <script src="./examples/index.js" type="module-shim"></script>
  </body>
</html>
